<title>Flight Deck Selection Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root{
  color-scheme: light dark;
  --bg:#E4E9E8; --panel:#FFFFFF; --panel-2:#F0F4F3; --panel-3:#E7ECEB;
  --line:#C4CFCD; --line-soft:#DAE2E0;
  --ink:#0D1719; --ink-2:#3A4B4D; --ink-3:#6A7A7C;
  --ok:#0A7A46; --ok-bg:#0a7a4618;
  --caution:#8F5E00; --caution-bg:#8f5e0018;
  --warn:#AF1119; --warn-bg:#af111918;
  --data:#0A6874; --data-bg:#0a687418;
  --target:#8A1C82;
  --aua:#C8102E;
  --sky:#1E6FA8; --ground:#7A5230;
  --shadow:0 1px 2px rgba(13,23,25,.07), 0 10px 26px -14px rgba(13,23,25,.3);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:3px; --maxw:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070B0D; --panel:#0E1417; --panel-2:#141B1F; --panel-3:#1A2328;
    --line:#253137; --line-soft:#182126;
    --ink:#E4EFEF; --ink-2:#A4B8BA; --ink-3:#6C8083;
    --ok:#22DD84; --ok-bg:#22dd841f;
    --caution:#FFB020; --caution-bg:#ffb0201f;
    --warn:#FF4D45; --warn-bg:#ff4d451f;
    --data:#4FD8E8; --data-bg:#4fd8e81f;
    --target:#F06FDA;
    --aua:#FF2E45;
    --sky:#15507E; --ground:#5A3B22;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#070B0D; --panel:#0E1417; --panel-2:#141B1F; --panel-3:#1A2328;
  --line:#253137; --line-soft:#182126;
  --ink:#E4EFEF; --ink-2:#A4B8BA; --ink-3:#6C8083;
  --ok:#22DD84; --ok-bg:#22dd841f;
  --caution:#FFB020; --caution-bg:#ffb0201f;
  --warn:#FF4D45; --warn-bg:#ff4d451f;
  --data:#4FD8E8; --data-bg:#4fd8e81f;
  --target:#F06FDA;
  --aua:#FF2E45;
  --sky:#15507E; --ground:#5A3B22;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -16px rgba(0,0,0,.9);
}

/* ── Base ───────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.13em;font-size:12px;color:var(--ink-3);line-height:1}
.hide{display:none!important}

/* ── Chrome ─────────────────────────────────────────────────────────── */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;height:56px}
.mark{display:flex;align-items:center;gap:9px;min-width:0}
.flag{width:15px;height:26px;flex-shrink:0;display:flex;flex-direction:column;border:1px solid var(--line)}
.flag i{flex:1;background:var(--aua)}
.flag i:nth-child(2){background:var(--panel)}
.mark b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.mark s{display:block;text-decoration:none;font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar nav{margin-left:auto;display:flex;gap:2px}
.topbar nav button{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.11em;font-size:13px;font-weight:600;color:var(--ink-3);padding:7px 11px;border-radius:var(--r)}
.topbar nav button:hover{color:var(--ink);background:var(--panel-2)}
.topbar nav button[aria-current="true"]{color:var(--ink);background:var(--panel-3)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}

/* status strip = EFIS header */
.strip{background:var(--panel-2);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px}
.strip .wrap{display:flex;align-items:center;gap:0;height:32px;overflow-x:auto;scrollbar-width:none}
.strip .wrap::-webkit-scrollbar{display:none}
.sitem{display:flex;align-items:baseline;gap:7px;padding:0 15px;border-right:1px solid var(--line-soft);white-space:nowrap;height:100%;align-items:center}
.sitem:first-child{padding-left:0}
.sitem u{text-decoration:none;font-family:var(--f-display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sitem b{font-weight:500;color:var(--data);font-variant-numeric:tabular-nums}
.sitem.warnv b{color:var(--warn)}
.sitem.cautv b{color:var(--caution)}
main{padding:26px 0 70px}

/* ── Cards / buttons ────────────────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:14px;padding:10px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--ink-3);background:var(--panel-2)}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:12.5px;padding:7px 13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger:hover{background:var(--warn-bg)}

/* ── Home ───────────────────────────────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;align-items:start;margin-bottom:34px}
.hero h1{font-size:clamp(34px,5.2vw,54px);font-weight:700;letter-spacing:-.005em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--ink-3);display:block}
.hero .sub{margin-top:14px;color:var(--ink-2);max-width:56ch}
.hero .cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.dash{padding:16px 18px}
.dash .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.dash .row:last-child{border:0;padding-bottom:0}
.dash .row b{font-family:var(--f-mono);font-size:19px;font-weight:500;color:var(--data);font-variant-numeric:tabular-nums}
.dash .row span{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;color:var(--ink-3)}
.dash h3{font-size:17px;text-transform:uppercase;letter-spacing:.11em;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px}

.sechead{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.sechead h2{font-size:20px;text-transform:uppercase;letter-spacing:.12em}
.sechead .rule{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.mod{padding:16px 17px 15px;text-align:left;display:flex;flex-direction:column;gap:9px;position:relative;transition:border-color .13s,transform .13s}
.mod:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.mod .mh{display:flex;align-items:flex-start;gap:11px}
.mod .ico{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--data);background:var(--panel-2)}
.mod h3{font-size:17px;letter-spacing:.05em;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto}
.mod .kind{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.mod p{color:var(--ink-2);font-size:13.5px;line-height:1.5}
.mod .mf{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:9px;border-top:1px solid var(--line-soft);font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.mod .best{margin-left:auto;color:var(--ok);font-weight:500}
.bar{height:3px;background:var(--panel-3);border-radius:2px;overflow:hidden;flex:1;max-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
</style>
<style>
/* ── Test surface ───────────────────────────────────────────────────── */
.stage{max-width:860px;margin:0 auto}
.stage.wide{max-width:1020px}
.briefing{padding:26px 28px}
.briefing h1{font-size:30px;text-transform:uppercase;letter-spacing:.05em}
.briefing .kind{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--aua);margin-bottom:6px}
.briefing p{color:var(--ink-2);margin-top:12px;max-width:66ch}
.briefing ul{color:var(--ink-2);margin:12px 0 0;padding-left:18px;max-width:66ch}
.briefing li{margin:5px 0}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin:20px 0}
.specs div{background:var(--panel);padding:10px 12px}
.specs u{text-decoration:none;display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.specs b{font-family:var(--f-mono);font-size:16px;font-weight:500;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;font-weight:600;padding:7px 14px;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qcount{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:15px;height:4px;border-radius:1px;background:var(--panel-3);border:1px solid var(--line-soft)}
.pips i.ok{background:var(--ok);border-color:var(--ok)}
.pips i.no{background:var(--warn);border-color:var(--warn)}
.pips i.now{background:var(--data);border-color:var(--data)}
.clock{margin-left:auto;font-family:var(--f-mono);font-size:19px;font-weight:500;color:var(--data);font-variant-numeric:tabular-nums}
.clock.low{color:var(--caution)}
.clock.crit{color:var(--warn)}
.tbar{height:3px;background:var(--panel-3);border-radius:2px;overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;background:var(--data);transition:width .25s linear}
.tbar i.low{background:var(--caution)}
.tbar i.crit{background:var(--warn)}

.qcard{padding:24px 26px}
.qtext{font-size:19px;line-height:1.5;color:var(--ink)}
.qtext.mono{font-size:17px}
.qsub{color:var(--ink-3);font-size:13.5px;margin-top:7px}
.opts{display:grid;gap:8px;margin-top:20px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;transition:border-color .12s,background .12s;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink-3);background:var(--panel-2)}
.opt kbd{font-family:var(--f-mono);font-size:11.5px;width:21px;height:21px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;color:var(--ink-3);background:var(--panel-2)}
.opt .t{flex:1;font-size:15.5px}
.opt.num .t{font-family:var(--f-mono);font-size:16.5px;font-variant-numeric:tabular-nums}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right kbd{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.opt.wrong kbd{border-color:var(--warn);color:var(--warn)}
.opt .vd{font-family:var(--f-display);font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.opt.pic{flex-direction:column;gap:0;padding:13px 12px;position:relative}
.opt.pic kbd{position:absolute;left:11px;top:11px}
.opt.pic .t{flex:none;display:flex;justify-content:center;width:100%}
.opt.pic .vd{position:absolute;right:12px;top:13px}
.opt.right .vd{color:var(--ok)}
.opt.wrong .vd{color:var(--warn)}
.expl{margin-top:16px;padding:13px 15px;border-left:2px solid var(--data);background:var(--data-bg);border-radius:0 var(--r) var(--r) 0;font-size:14px;color:var(--ink-2)}
.expl b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--data);display:block;margin-bottom:3px}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:18px}
.hintk{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}

/* numeric entry */
.audioq{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 16px 20px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r)}
.audioq .st{color:var(--ink-3)}
.audioq.silent .st{color:var(--caution);font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-size:14px}
.wavebars{display:flex;gap:5px;align-items:center;height:42px}
.wavebars i{width:5px;height:7px;border-radius:3px;background:var(--line);display:block;transition:height .16s ease,background .16s}
.audioq.playing .wavebars i{background:var(--data)}
.audioq.playing .wavebars i:nth-child(odd){height:30px}
.audioq.playing .wavebars i:nth-child(even){height:42px}
.audioq.playing .wavebars i:nth-child(3n){height:18px}
@media (prefers-reduced-motion:no-preference){
  .audioq.playing .wavebars i{animation:wv .9s ease-in-out infinite alternate}
  .audioq.playing .wavebars i:nth-child(2n){animation-delay:.12s}
  .audioq.playing .wavebars i:nth-child(3n){animation-delay:.24s}
}
@keyframes wv{from{height:9px}to{height:42px}}
.numin{display:flex;align-items:center;gap:10px;margin-top:20px}
.numin input{font-family:var(--f-mono);font-size:22px;padding:10px 14px;width:200px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
.numin .unit{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-size:14px}

/* ── Results ────────────────────────────────────────────────────────── */
.res{padding:26px 28px}
.res .verdict{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ring{width:96px;height:96px;flex-shrink:0}
.res h1{font-size:27px;text-transform:uppercase;letter-spacing:.05em}
.res .vsub{color:var(--ink-2);font-size:14px;margin-top:4px;max-width:52ch}
.grade{display:inline-block;font-family:var(--f-display);font-size:12px;letter-spacing:.15em;text-transform:uppercase;padding:3px 9px;border:1px solid currentColor;border-radius:var(--r);margin-bottom:7px}
.g-ok{color:var(--ok)} .g-cau{color:var(--caution)} .g-warn{color:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin:20px 0}
.metrics div{background:var(--panel);padding:11px 13px}
.metrics u{text-decoration:none;display:block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.metrics b{font-family:var(--f-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.review{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.review .rw{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px;align-items:flex-start}
.review .rw:last-child{border:0}
.review .rw .st{font-family:var(--f-mono);font-size:11px;flex-shrink:0;width:16px;text-align:center;padding-top:2px}
.review .rw.ok .st{color:var(--ok)} .review .rw.no .st{color:var(--warn)}
.review .rw .qq{color:var(--ink)}
.review .rw .aa{color:var(--ink-3);font-size:12.5px;margin-top:2px;font-family:var(--f-mono)}
.sparkrow{display:flex;align-items:center;gap:12px;margin-top:14px}

/* ── Instruments / canvas surfaces ──────────────────────────────────── */
.instwrap{display:flex;justify-content:center;padding:8px 0 4px}
.sixpack{display:grid;grid-template-columns:repeat(3,auto);gap:14px 16px;justify-content:center;padding:4px 0 10px;width:max-content;margin:0 auto}
.gridwrap{overflow-x:auto;padding-bottom:6px}
.memtable{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:14px}
.memtable th{font-family:var(--f-display);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600}
.memtable td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.memtable tr:last-child td{border-bottom:0}
.memtable td:first-child{color:var(--data);font-weight:500}
.scan{display:grid;gap:4px;justify-content:center;user-select:none}
.scan button{width:40px;height:42px;display:grid;place-items:center;font-family:var(--f-mono);font-size:16px;border:1px solid var(--line-soft);border-radius:2px;background:var(--panel-2);color:var(--ink);line-height:1}
.scan button:hover{border-color:var(--ink-3)}
.scan button.hit{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.scan button.miss{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.scan button.shown{background:var(--caution-bg);border-color:var(--caution);color:var(--caution)}
.target-legend{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;flex-wrap:wrap}
.target-legend .tg{width:40px;height:42px;display:grid;place-items:center;font-family:var(--f-mono);font-size:17px;border:1px solid var(--data);color:var(--data);border-radius:2px}

/* multitask */
.mt{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.mtpanel{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.mtpanel .lbl{margin-bottom:9px}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gauge{text-align:center}
.gauge canvas{display:block;width:100%;height:auto}
.gauge .gk{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-top:3px}
.gauge.alert .gk{color:var(--warn)}
.mtmath{min-height:92px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;text-align:center}
.mtmath .q{font-family:var(--f-mono);font-size:23px;color:var(--ink)}
.mtkeys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mtkeys button{font-family:var(--f-mono);font-size:14px;padding:7px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);min-width:44px}
.mtkeys button:hover{border-color:var(--ink-3)}
.chanbars{display:grid;gap:7px;margin-top:2px}
.chanbar{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.chanbar .nm{width:78px;flex-shrink:0;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.chanbar .bar{max-width:none}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;margin-top:10px}

<script>
"use strict";
document.documentElement.lang = "de";   /* enables German hyphenation for long module names */
/* ═══ Utilities ═════════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, attrs, kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(c));
  return n;
};
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
const sample = (a, n) => shuffle(a).slice(0, n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round = (v, d) => { const f = Math.pow(10, d || 0); return Math.round(v * f) / f; };
const pad = (n, w) => String(n).padStart(w || 2, "0");
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); };
const fmtDur = ms => { const s = Math.round(ms / 1000); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + pad(s % 60) + " s"; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ═══ Persistence ═══════════════════════════════════════════════════ */
const KEY = "aua-fdst-v1";
const Store = {
  data: { runs: [], settings: { level: 2, theme: null }, version: 1 },
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === "object") {
          this.data.runs = Array.isArray(p.runs) ? p.runs : [];
          this.data.settings = Object.assign(this.data.settings, p.settings || {});
        }
      }
    } catch (e) { /* Speicher nicht verfügbar – Training läuft, Verlauf wird nicht gesichert */ }
    return this.data;
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {} },
  addRun(r) {
    this.data.runs.push(Object.assign({ at: Date.now() }, r));
    if (this.data.runs.length > 400) this.data.runs = this.data.runs.slice(-400);
    this.save();
  },
  runsFor(id) { return this.data.runs.filter(r => r.module === id); },
  best(id) { const r = this.runsFor(id); return r.length ? Math.max.apply(null, r.map(x => x.score)) : null; },
  last(id) { const r = this.runsFor(id); return r.length ? r[r.length - 1].score : null; },
  avg(id) { const r = this.runsFor(id).slice(-5); return r.length ? Math.round(r.reduce((s, x) => s + x.score, 0) / r.length) : null; },
  totalTime() { return this.data.runs.reduce((s, r) => s + (r.timeMs || 0), 0); },
  set(k, v) { this.data.settings[k] = v; this.save(); },
  reset() { this.data.runs = []; this.save(); }
};
Store.load();

/* ═══ Theme ═════════════════════════════════════════════════════════ */
function applyTheme() {
  const t = Store.data.settings.theme;
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme();
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const now = cur ? cur : (sysDark ? "dark" : "light");
  Store.set("theme", now === "dark" ? "light" : "dark");
  applyTheme();
});

/* ═══ Status strip ══════════════════════════════════════════════════ */
let stripItems = [];
function setStrip(items) { stripItems = items || []; renderStrip(); }
function renderStrip() {
  const s = $("#strip");
  s.innerHTML = "";
  const base = [{ k: "Modus", v: State.mode }, { k: "Stufe", v: LEVELS[Store.data.settings.level].name }];
  base.concat(stripItems).forEach(it => {
    s.appendChild(el("div", { class: "sitem " + (it.tone === "warn" ? "warnv" : it.tone === "caution" ? "cautv" : "") }, [
      el("u", { text: it.k }), el("b", { text: it.v })
    ]));
  });
}

/* ═══ Levels ════════════════════════════════════════════════════════ */
const LEVELS = {
  1: { name: "Aufbau", t: 1.35, hard: 0, desc: "Mehr Zeit pro Aufgabe, einfachere Zahlen – zum Einarbeiten." },
  2: { name: "Prüfung", t: 1.0, hard: 1, desc: "Zeitdruck und Aufgabenniveau wie im Auswahlverfahren üblich." },
  3: { name: "Übersoll", t: 0.78, hard: 2, desc: "Deutlich über Prüfungsniveau – trainiert Reserve." }
};
const LV = () => LEVELS[Store.data.settings.level];
const lvl = () => Store.data.settings.level;

/* ═══ App state / router ════════════════════════════════════════════ */
const State = { mode: "BEREIT", route: "home", running: null };
const view = () => $("#view");
function clearView() {
  if (State.running && State.running.abort) { try { State.running.abort(); } catch (e) {} }
  State.running = null;
  view().innerHTML = "";
  document.onkeydown = null;
}
function go(route, arg) {
  clearView();
  State.route = route;
  State.mode = route === "home" ? "BEREIT" : route === "stats" ? "AUSWERTUNG" : State.mode;
  Array.from($("#nav").children).forEach(b => b.setAttribute("aria-current", String(b.dataset.go === route)));
  if (route === "home") { State.mode = "BEREIT"; setStrip([]); renderHome(); }
  else if (route === "stats") { setStrip([]); renderStats(); }
  else if (route === "exam") { State.mode = "BEREIT"; setStrip([]); renderExamIntro(); }
  else if (route === "brief") { State.mode = "BRIEFING"; setStrip([]); renderBriefing(arg); }
  window.scrollTo(0, 0);
  renderStrip();
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.go); });
</script>
<script>
/* ═══ Quiz engine ═══════════════════════════════════════════════════
   Generic runner for every question-based module. A module supplies a
   generator `next(i)` returning { stem, render?, options[], explain?, ... }.
   Resolves with { correct, total, score, timeMs, detail[] }.                */
function runQuiz(cfg) {
  return new Promise(resolve => {
    const total = cfg.count;
    const perQ = Math.round((cfg.perQ || 30) * LV().t * 1000);
    const feedback = cfg.feedback !== false;
    const detail = [];
    let i = 0, correct = 0, startAll = performance.now(), tick = null, qStart = 0, answered = false, aborted = false;

    const root = el("div", { class: "stage" });
    const head = el("div", { class: "qhead" });
    const pips = el("div", { class: "pips" });
    const cnt = el("div", { class: "qcount" });
    const clock = el("div", { class: "clock mono" });
    head.append(cnt, pips, clock);
    const tbar = el("div", { class: "tbar" }, [el("i")]);
    const card = el("div", { class: "card qcard" });
    root.append(head, tbar, card);
    view().innerHTML = "";
    view().appendChild(root);

    for (let p = 0; p < total; p++) pips.appendChild(el("i"));

    State.running = { abort() { aborted = true; clearInterval(tick); } };

    function updateClock() {
      const left = perQ - (performance.now() - qStart);
      const frac = clamp(left / perQ, 0, 1);
      clock.textContent = fmtClock(left);
      const bar = tbar.firstChild;
      bar.style.width = (frac * 100).toFixed(1) + "%";
      const cls = frac < .17 ? "crit" : frac < .34 ? "low" : "";
      clock.className = "clock mono " + cls;
      bar.className = cls;
      setStrip([
        { k: "Aufgabe", v: (i + 1) + "/" + total },
        { k: "Richtig", v: correct + "/" + Math.max(0, i) },
        { k: "Restzeit", v: fmtClock(left), tone: frac < .17 ? "warn" : frac < .34 ? "caution" : "" }
      ]);
      if (left <= 0 && !answered) answer(-1, true);
    }

    let cur = null, optNodes = [];
    async function nextQ() {
      if (aborted) return;
      if (i >= total) return finish();
      answered = false;
      redrawFns = [];
      cur = cfg.next(i);
      card.innerHTML = "";
      cnt.textContent = "AUFGABE " + pad(i + 1) + " / " + pad(total);
      Array.from(pips.children).forEach((p, ix) => { if (ix === i) p.classList.add("now"); });

      if (cur.eyebrow) card.appendChild(el("div", { class: "lbl", text: cur.eyebrow, style: "margin-bottom:10px" }));
      if (cur.render) { const holder = el("div"); card.appendChild(holder); cur.render(holder); }
      /* Acoustic items hide the stem: the task exists only as sound. */
      let audioBox = null;
      if (cur.audio) {
        audioBox = el("div", { class: "audioq" });
        audioBox.appendChild(el("div", { class: "wavebars" }, Array.from({ length: 11 }, () => el("i"))));
        audioBox.appendChild(el("div", { class: "st lbl", text: "Aufgabe wird angesagt" }));
        card.appendChild(audioBox);
      } else if (cur.stem) card.appendChild(el("div", { class: "qtext" + (cur.monoStem ? " mono" : ""), html: cur.stem }));
      if (cur.sub) card.appendChild(el("div", { class: "qsub", text: cur.sub }));

      const wrap = el("div", { class: "opts" + (cur.optionLayout === "two" ? " two" : "") });
      optNodes = [];
      cur.options.forEach((o, ix) => {
        const b = el("button", { class: "opt" + (cur.numericOpts ? " num" : "") + (o.render ? " pic" : ""), type: "button", onclick: () => answer(ix) });
        b.appendChild(el("kbd", { text: String(ix + 1) }));
        const t = el("div", { class: "t" });
        if (o.render) o.render(t); else t.innerHTML = o.t;
        b.appendChild(t);
        b.appendChild(el("div", { class: "vd" }));
        wrap.appendChild(b); optNodes.push(b);
      });
      card.appendChild(wrap);
      const foot0 = el("div", { class: "qfoot" });
      let replays = cur.audio ? (cur.audio.replays || 0) : 0;
      let replayBtn = null;
      if (cur.audio && replays > 0) {
        replayBtn = el("button", { class: "btn sm", text: "Nochmal hören (" + replays + "×)", onclick: () => sayTask(true) });
        foot0.appendChild(replayBtn);
      }
      foot0.appendChild(el("div", { class: "hintk", text: "Tasten 1–" + cur.options.length + " zum Antworten" }));
      card.appendChild(foot0);

      async function sayTask(isReplay) {
        if (isReplay) {
          if (replays <= 0 || answered) return;
          replays--;
          replayBtn.disabled = true;
          replayBtn.textContent = replays ? "Nochmal hören (" + replays + "×)" : "Keine Wiederholung mehr";
        }
        audioBox.classList.add("playing");
        $(".st", audioBox).textContent = "Aufgabe wird angesagt";
        const heard = await Speech.say(cur.audio.text, 0.92);
        audioBox.classList.remove("playing");
        $(".st", audioBox).textContent = heard ? "Ansage beendet" : "Kein Ton – Aufgabe: " + cur.audio.text;
        if (!heard) audioBox.classList.add("silent");
        if (isReplay && replayBtn && replays > 0) replayBtn.disabled = false;
      }
      if (cur.audio) { await sayTask(false); if (aborted || answered) return; }

      qStart = performance.now();
      clearInterval(tick); tick = setInterval(updateClock, 200); updateClock();
    }

    function answer(chosen, timeout) {
      if (answered) return;
      answered = true;
      clearInterval(tick);
      const took = performance.now() - qStart;
      const rightIx = cur.options.findIndex(o => o.ok);
      const ok = chosen === rightIx;
      if (ok) correct++;
      detail.push({
        q: cur.plain || (cur.stem || "").replace(/<[^>]+>/g, ""),
        your: timeout ? "— (Zeit abgelaufen)" : (cur.options[chosen].plain || cur.options[chosen].t || "Antwort " + (chosen + 1)),
        right: cur.options[rightIx].plain || cur.options[rightIx].t || "Antwort " + (rightIx + 1),
        ok, ms: took
      });
      const pip = pips.children[i];
      pip.classList.remove("now"); pip.classList.add(ok ? "ok" : "no");

      if (!feedback) { i++; setTimeout(nextQ, 90); return; }

      optNodes.forEach((n, ix) => {
        n.disabled = true;
        if (ix === rightIx) { n.classList.add("right"); $(".vd", n).textContent = "Richtig"; }
        if (ix === chosen && !ok) { n.classList.add("wrong"); $(".vd", n).textContent = "Deine Wahl"; }
      });
      if (cur.explain) card.appendChild(el("div", { class: "expl", html: "<b>Lösungsweg</b>" + cur.explain }));
      clearInterval(tick);
      const foot = $(".qfoot", card);
      foot.innerHTML = "";
      const nb = el("button", { class: "btn pri", text: i + 1 >= total ? "Auswertung" : "Weiter", onclick: () => { i++; nextQ(); } });
      foot.append(nb, el("div", { class: "hintk", text: "Enter" }));
      nb.focus();
    }

    document.onkeydown = e => {
      if (e.key === "Escape") { clearInterval(tick); go("home"); return; }
      if (!answered) {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= (cur ? cur.options.length : 0)) { e.preventDefault(); answer(n - 1); }
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); const b = $(".qfoot .btn", card); if (b) b.click();
      }
    };

    function finish() {
      clearInterval(tick);
      document.onkeydown = null;
      resolve({ correct, total, score: Math.round(correct / total * 100), timeMs: performance.now() - startAll, detail });
    }
    nextQ();
  });
}

/* ═══ Distractor helper ═════════════════════════════════════════════ */
function numOptions(correct, opts) {
  /* Distractors sit near the correct value so the answer cannot be found by
     magnitude alone; the halve/double pair covers the common formula slip. */
  const o = opts || {};
  const dec = o.dec === undefined ? 0 : o.dec;
  const unit = o.unit || "";
  const target = round(correct, dec);
  const mag = Math.abs(correct);
  const step = o.step || Math.max(Math.pow(10, -dec), round(mag * 0.08, dec) || 1);
  const set = new Set([target]);
  let guard = 0;
  while (set.size < 4 && guard++ < 300) {
    const r = Math.random();
    let d;
    if (r < .45) d = correct + (Math.random() < .5 ? -1 : 1) * step * ri(1, 3);
    else if (r < .75) d = correct * (1 + (Math.random() < .5 ? -1 : 1) * (0.09 + Math.random() * 0.3));
    else if (mag >= 20) d = correct * pick([0.5, 1.5, 2]);
    else d = correct + (Math.random() < .5 ? -1 : 1) * step * ri(1, 5);
    d = round(d, dec);
    if (o.positive !== false && d <= 0) continue;
    if (d !== target) set.add(d);
  }
  let fill = 1;
  while (set.size < 4) { set.add(round(target + step * fill, dec)); fill++; }
  const fmt = v => (dec > 0 ? v.toFixed(dec) : String(v)) + (unit ? " " + unit : "");
  return shuffle(Array.from(set)).map(v => ({ t: fmt(v), plain: fmt(v), ok: v === target }));
}
function textOptions(correct, wrongs) {
  const seen = new Set([String(correct)]);
  const out = [];
  for (const w of wrongs) {
    if (out.length === 3) break;
    const k = String(w);
    if (seen.has(k)) continue;
    seen.add(k); out.push({ t: w, plain: w, ok: false });
  }
  return shuffle([{ t: correct, plain: correct, ok: true }].concat(out));
}
</script>
<script>
/* ═══ Kopfrechnen – procedural generators ═══════════════════════════ */
const MathGen = {};

MathGen.arith = () => {
  const kind = pick(["mul", "div", "pct", "frac", "chain"]);
  if (kind === "mul") {
    const a = ri(12, 49), b = ri(11, 29);
    return { stem: `Berechne im Kopf: <span class="mono">${a} &times; ${b}</span>`, v: a * b, speech: `${a} mal ${b}`,
      explain: `${a} &times; ${b} = ${a} &times; ${b - b % 10} + ${a} &times; ${b % 10} = ${a * (b - b % 10)} + ${a * (b % 10)} = <b>${a * b}</b>` };
  }
  if (kind === "div") {
    const b = ri(6, 24), q = ri(11, 60), a = b * q;
    return { stem: `Berechne im Kopf: <span class="mono">${a} &divide; ${b}</span>`, v: q, speech: `${a} geteilt durch ${b}`,
      explain: `${b} &times; ${q} = ${a}, also ist das Ergebnis <b>${q}</b>.` };
  }
  if (kind === "pct") {
    const p = pick([5, 12, 15, 18, 24, 25, 35, 45, 60, 75]), base = ri(6, 48) * 20;
    return { stem: `Wie viel sind <span class="mono">${p}&nbsp;%</span> von <span class="mono">${base}</span>?`, v: base * p / 100, dec: base * p % 100 ? 1 : 0,
      speech: `${p} Prozent von ${base}`,
      explain: `1&nbsp;% von ${base} = ${base / 100}. ${p} &times; ${base / 100} = <b>${round(base * p / 100, 2)}</b>` };
  }
  if (kind === "frac") {
    const den = pick([4, 8, 16, 5, 20, 3, 6]), num = ri(1, den - 1), base = den * ri(8, 40);
    const denName = { 3: "Drittel", 4: "Viertel", 5: "Fünftel", 6: "Sechstel", 8: "Achtel", 16: "Sechzehntel", 20: "Zwanzigstel" }[den];
    return { stem: `Wie viel sind <span class="mono">${num}/${den}</span> von <span class="mono">${base}</span>?`, v: base * num / den,
      speech: `${num} ${denName} von ${base}`,
      explain: `${base} &divide; ${den} = ${base / den}; ${base / den} &times; ${num} = <b>${base * num / den}</b>` };
  }
  const a = ri(20, 90), b = ri(3, 12), c = ri(11, 40);
  return { stem: `Berechne im Kopf: <span class="mono">(${a} + ${c}) &times; ${b}</span>`, v: (a + c) * b,
    speech: `${a} plus ${c}, und das Ergebnis mal ${b}`,
    explain: `${a} + ${c} = ${a + c}; ${a + c} &times; ${b} = <b>${(a + c) * b}</b>` };
};

MathGen.sdt = () => {
  const gs = pick([180, 210, 240, 270, 300, 330, 360, 400, 420, 450, 480]);
  const mode = pick(["time", "dist", "gs"]);
  const min = pick([10, 12, 15, 20, 24, 25, 30, 36, 40, 45, 50]);
  const dist = Math.round(gs * min / 60);
  if (mode === "time") return { eyebrow: "Speed · Distance · Time",
    stem: `Ein Flugzeug fliegt mit einer Grundgeschwindigkeit von <b>${gs} kt</b>. Wie viele <b>Minuten</b> benötigt es für <b>${dist} NM</b>?`,
    v: min, unit: "min", speech: `Grundgeschwindigkeit ${gs} Knoten. Wie viele Minuten für ${dist} nautische Meilen?`, explain: `Zeit = Strecke &divide; Geschwindigkeit = ${dist} &divide; ${gs} h = ${round(dist / gs, 3)} h. &times; 60 = <b>${min} min</b>.<br>Faustformel: bei ${gs} kt legt man ${round(gs / 60, 1)} NM pro Minute zurück.` };
  if (mode === "dist") return { eyebrow: "Speed · Distance · Time",
    stem: `Grundgeschwindigkeit <b>${gs} kt</b>, Flugzeit <b>${min} Minuten</b>. Welche Strecke wird zurückgelegt?`,
    v: dist, unit: "NM", speech: `Grundgeschwindigkeit ${gs} Knoten, Flugzeit ${min} Minuten. Wie viele nautische Meilen?`, explain: `${gs} kt = ${round(gs / 60, 1)} NM/min. ${round(gs / 60, 1)} &times; ${min} = <b>${dist} NM</b>.` };
  return { eyebrow: "Speed · Distance · Time",
    stem: `Für <b>${dist} NM</b> werden <b>${min} Minuten</b> benötigt. Wie hoch ist die Grundgeschwindigkeit?`,
    v: Math.round(dist * 60 / min), unit: "kt", speech: `${dist} nautische Meilen in ${min} Minuten. Wie viele Knoten?`, explain: `${dist} NM &divide; ${min} min = ${round(dist / min, 2)} NM/min. &times; 60 = <b>${Math.round(dist * 60 / min)} kt</b>.` };
};

MathGen.fuel = () => {
  const ff = pick([1800, 2000, 2200, 2400, 2600, 2800, 3000, 3200]);
  if (Math.random() < .5) {
    const min = pick([15, 20, 30, 40, 45, 50, 75, 90]);
    return { eyebrow: "Treibstoffberechnung",
      stem: `Der Verbrauch beträgt <b>${ff} kg/h</b>. Wie viel Treibstoff wird in <b>${min} Minuten</b> verbraucht?`,
      v: Math.round(ff * min / 60), unit: "kg", step: 50,
      speech: `Verbrauch ${ff} Kilogramm pro Stunde. Wie viel Kilogramm in ${min} Minuten?`,
      explain: `${ff} kg/h &divide; 60 = ${round(ff / 60, 1)} kg/min. &times; ${min} min = <b>${Math.round(ff * min / 60)} kg</b>.` };
  }
  const h = pick([1, 1.5, 2, 2.5, 3]), onboard = ff * h;
  return { eyebrow: "Treibstoffberechnung",
    stem: `An Bord sind <b>${onboard} kg</b> Treibstoff, der Verbrauch beträgt <b>${ff} kg/h</b>. Wie viele <b>Minuten</b> Flugzeit verbleiben?`,
    v: Math.round(h * 60), unit: "min", step: 10,
    speech: `${onboard} Kilogramm an Bord, Verbrauch ${ff} Kilogramm pro Stunde. Wie viele Minuten Restflugzeit?`,
    explain: `${onboard} &divide; ${ff} = ${h} h = <b>${h * 60} min</b>.` };
};

MathGen.descent = () => {
  if (Math.random() < .5) {
    const fl = pick([100, 150, 180, 200, 240, 280, 310, 350, 370, 390]);
    const alt = pick([0, 3000, 5000, 6000]);
    const lose = fl * 100 - alt;
    return { eyebrow: "Sinkflugplanung · 3:1-Regel",
      stem: `Ein Flugzeug befindet sich auf <b>FL${fl}</b> und soll auf <b>${alt} ft</b> sinken. Nach der 3:1-Regel: Wie viele <b>NM</b> vor dem Punkt muss der Sinkflug beginnen?`,
      v: Math.round(lose / 1000 * 3), unit: "NM",
      speech: `Flugfläche ${fl}, sinken auf ${alt} Fuß. Wie viele nautische Meilen nach der 3 zu 1 Regel?`,
      explain: `Höhendifferenz = ${fl * 100} &minus; ${alt} = ${lose} ft = ${lose / 1000} tausend Fuß.<br>3:1-Regel: ${lose / 1000} &times; 3 = <b>${Math.round(lose / 1000 * 3)} NM</b>.` };
  }
  const gs = pick([180, 220, 240, 280, 300, 320, 360]);
  return { eyebrow: "Sinkflugplanung · 3°-Profil",
    stem: `Grundgeschwindigkeit <b>${gs} kt</b>. Welche <b>Sinkrate</b> (ft/min) hält ein 3°-Anflugprofil?`,
    v: gs * 5, unit: "ft/min", step: 100,
    speech: `Grundgeschwindigkeit ${gs} Knoten. Welche Sinkrate in Fuß pro Minute hält ein 3 Grad Profil?`,
    explain: `Faustformel für 3°: Sinkrate &asymp; Grundgeschwindigkeit &times; 5.<br>${gs} &times; 5 = <b>${gs * 5} ft/min</b>.` };
};

MathGen.convert = () => {
  const c = pick([
    { q: v => `<b>${v} NM</b> entsprechen wie vielen Kilometern?`, sp: v => `${v} nautische Meilen. Wie viele Kilometer?`, gen: () => ri(4, 60) * 10, f: v => v * 1.852, u: "km", dec: 0, e: v => `1 NM = 1,852 km &rarr; ${v} &times; 1,852 = <b>${round(v * 1.852, 0)} km</b>` },
    { q: v => `<b>${v} km</b> entsprechen wie vielen nautischen Meilen?`, sp: v => `${v} Kilometer. Wie viele nautische Meilen?`, gen: () => ri(5, 60) * 10, f: v => v / 1.852, u: "NM", dec: 0, e: v => `${v} &divide; 1,852 = <b>${round(v / 1.852, 0)} NM</b>` },
    { q: v => `<b>${v} ft</b> entsprechen wie vielen Metern?`, sp: v => `${v} Fuß. Wie viele Meter?`, gen: () => ri(10, 120) * 100, f: v => v * 0.3048, u: "m", dec: 0, e: v => `1 ft = 0,3048 m &rarr; ${v} &times; 0,3048 &asymp; <b>${round(v * .3048, 0)} m</b>` },
    { q: v => `<b>${v} m</b> entsprechen wie vielen Fuß?`, sp: v => `${v} Meter. Wie viele Fuß?`, gen: () => ri(3, 40) * 100, f: v => v / 0.3048, u: "ft", dec: 0, e: v => `${v} &divide; 0,3048 &asymp; ${v} &times; 3,28 = <b>${round(v / .3048, 0)} ft</b>` },
    { q: v => `<b>${v} kg</b> entsprechen wie vielen Pfund (lbs)?`, sp: v => `${v} Kilogramm. Wie viele Pfund?`, gen: () => ri(20, 300) * 10, f: v => v * 2.2046, u: "lbs", dec: 0, e: v => `1 kg = 2,2046 lbs &rarr; ${v} &times; 2,2 &asymp; <b>${round(v * 2.2046, 0)} lbs</b>` },
    { q: v => `<b>${v} Liter</b> Kerosin bei einer Dichte von 0,80 kg/l entsprechen wie vielen Kilogramm?`, sp: v => `${v} Liter Kerosin bei einer Dichte von 0 Komma 8. Wie viele Kilogramm?`, gen: () => ri(50, 400) * 10, f: v => v * .8, u: "kg", dec: 0, e: v => `${v} &times; 0,80 = <b>${round(v * .8, 0)} kg</b>` },
    { q: v => `<b>${v} °C</b> entsprechen wie vielen Grad Fahrenheit?`, sp: v => `${v} Grad Celsius. Wie viel Grad Fahrenheit?`, gen: () => ri(-40, 40), f: v => v * 9 / 5 + 32, u: "°F", dec: 0, pos: false, e: v => `°F = °C &times; 1,8 + 32 = ${v} &times; 1,8 + 32 = <b>${round(v * 1.8 + 32, 0)} °F</b>` },
    { q: v => `<b>${v} kt</b> entsprechen wie vielen Metern pro Sekunde?`, sp: v => `${v} Knoten. Wie viele Meter pro Sekunde?`, gen: () => ri(2, 24) * 10, f: v => v * .5144, u: "m/s", dec: 1, e: v => `1 kt &asymp; 0,514 m/s &rarr; ${v} &times; 0,514 = <b>${round(v * .5144, 1)} m/s</b>` }
  ]);
  const v = c.gen();
  return { eyebrow: "Einheitenumrechnung", stem: c.q(v), speech: c.sp(v), v: c.f(v), unit: c.u, dec: c.dec, positive: c.pos !== false, explain: c.e(v) };
};

MathGen.wind = () => {
  const rwyDeg = pick([4, 9, 11, 16, 21, 25, 29, 34]) * 10;
  const ang = pick([30, 45, 60, 90]);
  const forceCross = ang === 90;
  const side = pick([-1, 1]);
  const factor = { 30: .5, 45: .7, 60: .87, 90: 1 }[ang];
  const spd = pick([10, 12, 15, 18, 20, 24, 25, 30]);
  let wd = (rwyDeg + side * ang + 360) % 360; if (wd === 0) wd = 360;
  const xw = spd * factor;
  const cross = forceCross || Math.random() < .55;
  return { eyebrow: "Windkomponente",
    stem: `Piste <b>${pad(rwyDeg / 10)}</b> (Richtung ${pad(rwyDeg, 3)}°), Wind <b>${pad(wd, 3)}°/${spd} kt</b>. Wie groß ist die <b>${cross ? "Seitenwind" : "Gegenwind"}komponente</b>?`,
    v: cross ? xw : spd * { 30: .87, 45: .7, 60: .5, 90: 0 }[ang], unit: "kt", dec: 0, step: 2,
    speech: `Piste ${pad(rwyDeg / 10)}, Wind aus ${pad(wd, 3)} Grad mit ${spd} Knoten. Wie groß ist die ${cross ? "Seitenwindkomponente" : "Gegenwindkomponente"}?`,
    explain: `Winkel zwischen Pistenrichtung und Wind = ${ang}°.<br>Uhrzeigerregel: 30° &rarr; 1/2, 45° &rarr; 0,7, 60° &rarr; 0,9, 90° &rarr; 1/1 des Windes als Seitenwind (Gegenwind jeweils umgekehrt).<br>${cross ? `Seitenwind = ${spd} &times; ${factor} = <b>${round(xw, 0)} kt</b>` : `Gegenwind = ${spd} &times; ${{ 30: .87, 45: .7, 60: .5, 90: 0 }[ang]} = <b>${round(spd * { 30: .87, 45: .7, 60: .5, 90: 0 }[ang], 0)} kt</b>`}` };
};

MathGen.pax = () => {
  const seats = pick([76, 100, 120, 138, 174, 186, 200, 220]);
  const lf = pick([62, 68, 72, 75, 80, 84, 88, 92]);
  const pax = Math.round(seats * lf / 100);
  if (Math.random() < .5) return { eyebrow: "Anteilsrechnung",
    stem: `Ein Flugzeug hat <b>${seats} Sitzplätze</b> und ist zu <b>${lf} %</b> ausgelastet. Wie viele Passagiere sind an Bord?`,
    v: pax, unit: "Pax", speech: `${seats} Sitzplätze, ${lf} Prozent Auslastung. Wie viele Passagiere?`, explain: `${seats} &times; ${lf / 100} = <b>${pax} Passagiere</b>.` };
  return { eyebrow: "Anteilsrechnung",
    stem: `Von <b>${seats} Sitzplätzen</b> sind <b>${pax}</b> belegt. Wie hoch ist die Auslastung in Prozent?`,
    v: Math.round(pax / seats * 100), unit: "%", speech: `Von ${seats} Sitzplätzen sind ${pax} belegt. Wie viel Prozent Auslastung?`, explain: `${pax} &divide; ${seats} = ${round(pax / seats, 3)} = <b>${Math.round(pax / seats * 100)} %</b>.` };
};

MathGen.time = () => {
  const dh = ri(0, 23), dm = pick([0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
  const fh = ri(1, 11), fm = pick([5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
  const tot = dh * 60 + dm + fh * 60 + fm;
  const ah = Math.floor(tot / 60) % 24, am = tot % 60;
  const right = pad(ah) + ":" + pad(am);
  const wrongs = shuffle([
    pad((ah + 1) % 24) + ":" + pad(am), pad(ah) + ":" + pad((am + 10) % 60),
    pad((ah + 23) % 24) + ":" + pad(am), pad((ah + 1) % 24) + ":" + pad((am + 60 - 5) % 60)
  ]).filter(w => w !== right);
  return { eyebrow: "Zeitrechnung (UTC)",
    stem: `Abflug um <b>${pad(dh)}:${pad(dm)} UTC</b>, geplante Flugzeit <b>${fh} h ${pad(fm)} min</b>. Wann ist die geplante Ankunft (UTC)?`,
    opts: textOptions(right, wrongs),
    speech: `Abflug ${pad(dh)} Uhr ${pad(dm)} UTC, Flugzeit ${fh} Stunden ${pad(fm)} Minuten. Wann ist die Ankunft?`,
    explain: `${pad(dh)}:${pad(dm)} + ${fh}:${pad(fm)} = ${pad(dh + fh)}:${pad(dm + fm)} &rarr; umgerechnet <b>${right} UTC</b>.` };
};

MathGen.isa = () => {
  const fl = pick([50, 80, 100, 120, 150, 180, 200, 240, 280, 300, 340]);
  const isaT = 15 - 2 * (fl / 10);
  if (Math.random() < .5) return { eyebrow: "Standardatmosphäre",
    stem: `Wie hoch ist die <b>ISA-Standardtemperatur</b> auf <b>FL${fl}</b>?`,
    v: isaT, unit: "°C", positive: false, step: 3,
    speech: `Wie hoch ist die ISA Standardtemperatur auf Flugfläche ${fl}?`,
    explain: `ISA: 15 °C am Boden, &minus;2 °C pro 1000 ft.<br>15 &minus; (2 &times; ${fl / 10}) = <b>${isaT} °C</b>.` };
  const dev = pick([-10, -5, 5, 8, 10, 12, 15]);
  const oat = isaT + dev;
  return { eyebrow: "Standardatmosphäre",
    stem: `Auf <b>FL${fl}</b> wird eine Außentemperatur von <b>${oat} °C</b> gemessen. Wie groß ist die <b>ISA-Abweichung</b>?`,
    v: dev, unit: "°C", positive: false, step: 3,
    speech: `Flugfläche ${fl}, Außentemperatur ${oat} Grad Celsius. Wie groß ist die ISA Abweichung?`,
    explain: `ISA auf FL${fl} = 15 &minus; ${2 * fl / 10} = ${isaT} °C.<br>Abweichung = ${oat} &minus; (${isaT}) = <b>${dev > 0 ? "+" : ""}${dev} °C</b>.` };
};

MathGen.altimeter = () => {
  const qnh = pick([978, 985, 992, 998, 1003, 1008, 1021, 1028, 1033]);
  const d = qnh - 1013;
  return { eyebrow: "Höhenmessereinstellung",
    stem: `Der Höhenmesser steht auf <b>1013 hPa</b>, das aktuelle QNH beträgt <b>${qnh} hPa</b>. Um wie viele <b>Fuß</b> weicht die angezeigte Höhe von der tatsächlichen ab? (27 ft pro hPa)`,
    v: Math.abs(d) * 27, unit: "ft", step: 20,
    speech: `Höhenmesser steht auf 1013 Hektopascal, das QNH beträgt ${qnh}. Um wie viele Fuß weicht die Anzeige ab? 27 Fuß pro Hektopascal.`,
    explain: `Differenz = |${qnh} &minus; 1013| = ${Math.abs(d)} hPa.<br>${Math.abs(d)} &times; 27 = <b>${Math.abs(d) * 27} ft</b>. Bei ${qnh} hPa (${d < 0 ? "tiefer" : "höher"} als Standard) zeigt der Höhenmesser ${d < 0 ? "zu viel" : "zu wenig"} an.` };
};

MathGen.climb = () => {
  const roc = pick([600, 800, 1000, 1200, 1500, 1800, 2000, 2400]);
  const gs = pick([120, 150, 180, 200, 240, 300]);
  return { eyebrow: "Steigprofil",
    stem: `Ein Flugzeug steigt mit <b>${roc} ft/min</b> bei einer Grundgeschwindigkeit von <b>${gs} kt</b>. Wie viele <b>Fuß pro NM</b> gewinnt es?`,
    v: Math.round(roc / (gs / 60)), unit: "ft/NM", step: 20,
    speech: `Steigrate ${roc} Fuß pro Minute bei ${gs} Knoten Grundgeschwindigkeit. Wie viele Fuß pro nautische Meile?`,
    explain: `${gs} kt = ${round(gs / 60, 1)} NM/min.<br>${roc} ft/min &divide; ${round(gs / 60, 1)} NM/min = <b>${Math.round(roc / (gs / 60))} ft/NM</b>.` };
};

MathGen.ratio = () => {
  const p1 = ri(2, 5), t1 = pick([12, 15, 18, 20, 24, 30, 36, 40, 60]);
  const p2 = p1 + ri(1, 4);
  const t2 = p1 * t1 / p2;
  return { eyebrow: "Proportionalität",
    stem: `<b>${p1} Betankungspumpen</b> füllen einen Tank in <b>${t1} Minuten</b>. Wie lange brauchen <b>${p2} Pumpen</b> gleicher Leistung?`,
    v: t2, unit: "min", dec: t2 % 1 ? 1 : 0,
    speech: `${p1} Pumpen füllen einen Tank in ${t1} Minuten. Wie lange brauchen ${p2} Pumpen?`,
    explain: `Gesamtarbeit = ${p1} &times; ${t1} = ${p1 * t1} Pumpenminuten.<br>${p1 * t1} &divide; ${p2} = <b>${round(t2, 1)} min</b> (umgekehrt proportional).` };
};

MathGen.series = () => {
  const kind = pick(["add", "mul", "alt", "sq", "fib"]);
  let seq = [], v = 0;
  if (kind === "add") { let a = ri(3, 20), d = ri(3, 13); for (let i = 0; i < 5; i++) seq.push(a + d * i); v = a + d * 5; }
  else if (kind === "mul") { let a = ri(2, 6), q = ri(2, 3); for (let i = 0; i < 5; i++) seq.push(a * Math.pow(q, i)); v = a * Math.pow(q, 5); }
  else if (kind === "alt") { let a = ri(40, 90), d = ri(4, 11); for (let i = 0; i < 5; i++) seq.push(a + (i % 2 ? -1 : 1) * d * i); v = a + (5 % 2 ? -1 : 1) * d * 5; }
  else if (kind === "sq") { const s = ri(2, 7); for (let i = 0; i < 5; i++) seq.push(Math.pow(s + i, 2)); v = Math.pow(s + 5, 2); }
  else { let a = ri(1, 5), b = ri(2, 8); seq = [a, b]; for (let i = 0; i < 3; i++) seq.push(seq[seq.length - 1] + seq[seq.length - 2]); v = seq[4] + seq[3]; }
  const names = { add: "Konstante Differenz", mul: "Konstanter Faktor", alt: "Alternierende Differenz", sq: "Quadratzahlen", fib: "Summe der beiden Vorgänger" };
  return { eyebrow: "Zahlenreihe",
    stem: `Wie lautet die nächste Zahl?<br><span class="mono" style="font-size:22px;letter-spacing:.06em">${seq.join("&nbsp;&nbsp;·&nbsp;&nbsp;")}&nbsp;&nbsp;·&nbsp;&nbsp;?</span>`,
    v, positive: false, explain: `Bildungsgesetz: ${names[kind]}. Nächstes Glied = <b>${v}</b>.` };
};

const MATH_GENS = [MathGen.arith, MathGen.sdt, MathGen.fuel, MathGen.descent, MathGen.convert, MathGen.wind,
                   MathGen.pax, MathGen.time, MathGen.isa, MathGen.altimeter, MathGen.climb, MathGen.ratio, MathGen.series];

function mathQuestion(mode) {
  const easy = [MathGen.arith, MathGen.sdt, MathGen.fuel, MathGen.convert, MathGen.pax, MathGen.series];
  let q, guard = 0;
  do { q = (lvl() === 1 ? pick(easy) : pick(MATH_GENS))(); }
  while (mode === "audio" && !q.speech && guard++ < 60);   /* Zahlenreihen lassen sich nicht ansagen */
  const acoustic = mode === "audio" && !!q.speech;
  return {
    eyebrow: (q.eyebrow || "Kopfrechnen") + (acoustic ? " · Ansage" : ""),
    stem: q.stem,
    audio: acoustic ? { text: q.speech, replays: lvl() === 3 ? 0 : 1 } : null,
    sub: acoustic ? "Die Aufgabe wird nur angesagt. Ohne Taschenrechner und ohne Notizen rechnen."
                  : "Ohne Taschenrechner und ohne Notizen rechnen.",
    plain: (acoustic ? "[angesagt] " : "") + q.stem.replace(/<[^>]+>/g, ""),
    numericOpts: !q.opts,
    options: q.opts || numOptions(q.v, { unit: q.unit, dec: q.dec || 0, positive: q.positive, step: q.step }),
    explain: (acoustic ? `Angesagt war: <b>${esc(q.speech)}</b><br>` : "") + q.explain
  };
}

function engQuestion(i, used) {

  do { item = pick(ENG_BANK); } while (used.has(item.q) && guard++ < 90);
  used.add(item.q);
  const stem = (item.ctx ? `<div style="font-size:14.5px;line-height:1.6;color:var(--ink-2);padding:13px 15px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;margin-bottom:16px">${item.ctx}</div>` : "") + item.q;
  return {
    eyebrow: item.cat, stem, plain: item.q.replace(/<[^>]+>/g, ""),
    sub: "Choose the best answer.",

  };
